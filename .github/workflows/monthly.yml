name: Monthly AI Summary

on:
  schedule:
    # 每月 1 号 北京时间 10:00 = UTC 02:00
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026), empty = previous month'
        required: false
        default: ''
      month:
        description: 'Month (1-12), empty = previous month'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_THINKING_MODE: ${{ vars.DEEPSEEK_THINKING_MODE || 'disabled' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore site history from gh-pages
        run: bash scripts/publish_gh_pages.sh restore

      - name: Generate monthly summary
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="--year ${{ github.event.inputs.year }} --month ${{ github.event.inputs.month }}"
          fi
          python -m src.main_monthly $ARGS

      - name: Publish site to gh-pages
        run: bash scripts/publish_gh_pages.sh publish docs "chore(monthly): publish monthly summary"

      - name: Trigger Pages deploy
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
