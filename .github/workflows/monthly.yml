name: Monthly AI Summary

on:
  schedule:
    # 每月 1 号 北京时间 10:00 = UTC 02:00
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026), empty = previous month'
        type: string
        required: false
        default: ''
      month:
        description: 'Month (1-12), empty = previous month'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      report: monthly
      year: ${{ inputs.year || '' }}
      month: ${{ inputs.month || '' }}
    secrets: inherit
