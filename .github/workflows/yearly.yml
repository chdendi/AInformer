name: Yearly AI Summary

on:
  schedule:
    # 每年 1 月 2 号 北京时间 11:00 = UTC 03:00（让月报先于 1 号跑完）
    - cron: '0 3 2 1 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026), empty = previous year'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: yearly-summary
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_THINKING_MODE: ${{ vars.DEEPSEEK_THINKING_MODE || 'disabled' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate yearly summary
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="--year ${{ github.event.inputs.year }}"
          fi
          python -m src.main_yearly $ARGS

      - name: Commit and push
        run: |
          git config user.name "ainformer-bot"
          git config user.email "ainformer-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(yearly): publish yearly summary"
            git push
          fi
