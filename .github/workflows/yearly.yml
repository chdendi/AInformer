name: Yearly AI Summary

on:
  schedule:
    # 每年 1 月 2 号 北京时间 11:00 = UTC 03:00（让月报先于 1 号跑完）
    - cron: '0 3 2 1 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year (e.g. 2026), empty = previous year'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      report: yearly
      year: ${{ inputs.year || '' }}
    secrets: inherit
