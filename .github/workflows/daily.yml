name: Daily AI Report

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD), empty = today'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      report: daily
      date: ${{ inputs.date || '' }}
    secrets: inherit
