name: Daily AI Report

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD), empty = today'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      DEEPSEEK_THINKING_MODE: ${{ vars.DEEPSEEK_THINKING_MODE || 'disabled' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore site history from gh-pages
        run: bash scripts/publish_gh_pages.sh restore

      - name: Generate daily report
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m src.main_daily --date "${{ github.event.inputs.date }}"
          else
            python -m src.main_daily
          fi

      - name: Publish site to gh-pages
        run: |
          DATE=$(date -u +%Y-%m-%d)
          bash scripts/publish_gh_pages.sh publish docs "chore(daily): publish AI report ${DATE}"

      - name: Trigger Pages deploy
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
